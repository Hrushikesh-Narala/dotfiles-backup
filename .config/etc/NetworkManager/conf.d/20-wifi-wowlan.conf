# Keep Wi-Fi associated while the machine is suspended.
#
# NetworkManager tears the radio down on sleep unless Wake-on-LAN is armed,
# so this must be enabled for the association to survive suspend.
#
# NOTE: the value MUST be the numeric bitmask. NetworkManager parses this key
# with _nm_utils_ascii_str_to_int64(), so names like "magic,disconnect" parse
# as 0 and silently disable the feature. The man page documents no format for
# this key, which makes the mistake easy to make.
#
#   magic      (0x8) = 8
#   disconnect (0x4) = 4
#   0xc = 12 = magic|disconnect
#
# Profiles left at the default (0x1) inherit this, so it applies to every
# Wi-Fi network, including ones never connected to before.
[connection]
wifi.wake-on-wlan=12